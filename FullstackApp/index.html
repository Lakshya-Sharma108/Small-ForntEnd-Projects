<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Manager</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background: #f4f6f9;
    display:flex;
    justify-content:center;
    padding:40px 20px;
}

.container{
    width:100%;
    max-width:900px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#222;
}

.card{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    margin-bottom:25px;
}

.card h2{
    margin-bottom:15px;
    color:#333;
}

.form-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

input{
    flex:1;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
    transition:0.3s;
}

input:focus{
    border-color:#4CAF50;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.btn-primary{
    background:#4CAF50;
    color:white;
}

.btn-primary:hover{
    background:#43a047;
}

.btn-delete{
    background:#e53935;
    color:white;
    padding:6px 10px;
    font-size:13px;
}

.btn-delete:hover{
    background:#c62828;
}

ul{
    list-style:none;
    margin-top:10px;
}

.student-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    background:#fafafa;
    border-radius:6px;
    margin-bottom:10px;
}

.student-info{
    font-size:14px;
    color:#333;
}

@media(max-width:600px){
    .form-group{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Student Manager System</h1>

    <div class="card">
        <h2>Add Student</h2>
        <div class="form-group">
            <input type="text" id="name" placeholder="Enter Name">
            <input type="email" id="email" placeholder="Enter Email">
            <button class="btn-primary" onclick="addStudent()">Add Student</button>
        </div>
    </div>

    <div class="card">
        <h2>Student List</h2>
        <ul id="list"></ul>
    </div>
</div>

<script>
function addStudent(){
    let name=document.getElementById("name").value;
    let email=document.getElementById("email").value;

    if(name==="" || email===""){
        alert("Please fill all fields");
        return;
    }

    fetch("http://localhost:8080/add",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name,email})
    }).then(()=>{
        document.getElementById("name").value="";
        document.getElementById("email").value="";
        loadStudents();
    });
}

function loadStudents(){
 fetch("http://localhost:8080/students")
 .then(res=>res.json())
 .then(data=>{
    let list=document.getElementById("list");
    list.innerHTML="";
    data.forEach(s=>{
      list.innerHTML+=`
        <li class="student-item">
            <div class="student-info">
                <strong>${s.name}</strong><br>
                ${s.email}
            </div>
            <button class="btn-delete" onclick="del(${s.id})">Delete</button>
        </li>`;
    })
 });
}

function del(id){
 fetch("http://localhost:8080/delete/"+id,{method:"DELETE"})
 .then(()=>loadStudents());
}

loadStudents();
</script>

</body>
</html>
