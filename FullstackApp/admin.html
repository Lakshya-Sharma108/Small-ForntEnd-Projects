<!DOCTYPE html>
<html>

<head>
    <title>Admin Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f1f5f9
        }

        .sidebar {
            width: 220px;
            height: 100vh;
            background: #0f172a;
            color: white;
            position: fixed;
            padding: 20px
        }

        .sidebar h2 {
            margin-bottom: 30px
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            margin: 15px 0
        }

        .main {
            margin-left: 220px;
            padding: 30px
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .1);
            margin-bottom: 20px
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left
        }

        button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer
        }

        .del {
            background: red
        }

        .addbtn {
            background: #22c55e;
            margin-left: 10px
        }

        .logout {
            float: right;
            background: red;
            padding: 8px 16px;
            border-radius: 6px
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>Admin</h2>
        <a href="#">Dashboard</a>
        <a href="#">Students</a>
    </div>

    <div class="main">
        <h1>Admin Dashboard
            <button class="logout" onclick="logout()">Logout</button>
        </h1>

        <div class="card">
            <h3>Total Students: <span id="total">0</span></h3>
        </div>

        <div class="card">
            <input id="name" placeholder="Name">
            <input id="email" placeholder="Email">
            <button class="addbtn" onclick="addStudent()">Add</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="table"></tbody>
        </table>

    </div>

    <script>

        let token = localStorage.getItem("token");
        if (!token) { location = "login.html"; }

        loadStudents();

        function loadStudents() {
            fetch("http://localhost:8080/students", {
                headers: { "Authorization": "Bearer " + token }
            })
                .then(res => res.json())
                .then(data => {

                    document.getElementById("total").innerText = data.length;

                    let html = "";
                    data.forEach(s => {
                        html += `
<tr>
<td>${s.id}</td>
<td>${s.name}</td>
<td>${s.email}</td>
<td>
<button class="del" onclick="del(${s.id})">Delete</button>
</td>
</tr>
`;
                    });
                    document.getElementById("table").innerHTML = html;

                })
                .catch(err => {
                    console.log("ERROR:", err);
                    alert("Backend not responding or token invalid");
                });
        }

        function addStudent() {

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;

            fetch("http://localhost:8080/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + localStorage.getItem("token")
                },
                body: JSON.stringify({
                    name: name,
                    email: email
                })
            })
                .then(res => res.json())
                .then(data => {
                    alert("Student Added");
                    loadStudents();
                })
                .catch(err => console.error(err));
        }

        function del(id) {
            fetch("http://localhost:8080/delete/" + id, {
                method: "DELETE",
                headers: { "Authorization": "Bearer " + token }
            })
                .then(() => loadStudents());
        }

        function logout() {
            localStorage.removeItem("token");
            location = "login.html";
        }

    </script>
</body>

</html>
