<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body {
            display: flex;
            background: #f1f5f9;
            height: 100vh
        }

        /* Sidebar */
        .sidebar {
            width: 230px;
            background: #111827;
            color: white;
            padding: 20px;
            position: fixed;
            height: 100%;
        }

        .sidebar h2 {
            margin-bottom: 30px;
            text-align: center;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            padding: 12px;
            margin: 8px 0;
            text-decoration: none;
            border-radius: 6px;
        }

        .sidebar a:hover {
            background: #1f2937;
            color: white
        }

        /* Main */
        .main {
            margin-left: 230px;
            width: 100%
        }

        .top {
            background: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1)
        }

        .logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .content {
            padding: 25px
        }

        .card-box {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 20px;
            flex: 1;
            min-width: 200px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        input {
            padding: 10px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .add {
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #111827;
            color: white
        }

        .del {
            background: #ef4444;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 6px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
        }

        .save {
            background: #22c55e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>Admin</h2>
        <a href="#">Dashboard</a>
        <a href="#">Students</a>
    </div>

    <div class="main">

        <div class="top">
            <h3>Admin Dashboard</h3>
            <button class="logout" onclick="logout()">Logout</button>
        </div>

        <div class="content">

            <div class="card-box">
                <div class="card">
                    <h3>Total Students</h3>
                    <h2 id="total">0</h2>
                </div>

                <div class="card">
                    <h3>Status</h3>
                    <h2>Active</h2>
                </div>
            </div>

            <div class="form">
                <h3>Add Student (Admin Only)</h3>
                <input id="name" placeholder="Name">
                <input id="email" placeholder="Email">
                <button class="add" onclick="addStudent()">Add</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="table"></tbody>
            </table>

        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="modal">
        <div class="modal-box">
            <h3>Edit Student</h3>
            <input id="editName" placeholder="Name">
            <input id="editEmail" placeholder="Email">
            <button class="save" onclick="updateStudent()">Update</button>
        </div>
    </div>

    <script>
        let token = localStorage.getItem("token");
        if (!token) { window.location = "login.html"; }

        let editId = null;

        function logout() {
            localStorage.removeItem("token");
            window.location = "login.html";
        }

        function addStudent() {
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;

            fetch("http://localhost:8080/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ name, email })
            }).then(() => load());
        }

        function load() {
            fetch("http://localhost:8080/students", {
                headers: { "Authorization": token }
            })
                .then(res => res.json())
                .then(data => {
                    let table = document.getElementById("table");
                    table.innerHTML = "";
                    document.getElementById("total").innerText = data.length;

                    data.forEach(s => {
                        table.innerHTML += `
<tr>
<td>${s.id}</td>
<td>${s.name}</td>
<td>${s.email}</td>
<td>
<button class="edit" onclick="openEdit(${s.id},'${s.name}','${s.email}')">Edit</button>
<button class="del" onclick="del(${s.id})">Delete</button>
</td>
</tr>`;
                    });
                });
        }

        function del(id) {
            fetch("http://localhost:8080/delete/" + id, {
                method: "DELETE",
                headers: { "Authorization": token }
            }).then(() => load());
        }

        function openEdit(id, name, email) {
            editId = id;
            document.getElementById("editName").value = name;
            document.getElementById("editEmail").value = email;
            document.getElementById("modal").style.display = "flex";
        }

        function updateStudent() {
            let name = document.getElementById("editName").value;
            let email = document.getElementById("editEmail").value;

            fetch("http://localhost:8080/update/" + editId, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": token
                },
                body: JSON.stringify({ name, email })
            }).then(() => {
                document.getElementById("modal").style.display = "none";
                load();
            });
        }

        window.onclick = function (e) {
            if (e.target.id === "modal") {
                document.getElementById("modal").style.display = "none";
            }
        }

        load();
    </script>

</body>

</html>
