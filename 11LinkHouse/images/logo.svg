<svg
  xmlns="http://www.w3.org/2000/svg"
  width="120"
  height="120"
  viewBox="0 0 120 120"
>
  <!-- House outline -->
  <path
    d="M20 55 L60 25 L100 55 V95 H20 Z"
    fill="none"
    stroke="#000"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- Link nodes -->
  <circle cx="45" cy="65" r="4" fill="#000"/>
  <circle cx="75" cy="65" r="4" fill="#000"/>
  <circle cx="60" cy="80" r="4" fill="#000"/>

  <!-- Link connections -->
  <line x1="45" y1="65" x2="60" y2="80" stroke="#000" stroke-width="2"/>
  <line x1="75" y1="65" x2="60" y2="80" stroke="#000" stroke-width="2"/>
</svg>
