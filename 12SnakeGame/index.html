<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section>

            <!-- Infos -->
            <div class="infos">
                <div class="info">
                    <h3>High Score: <span id="high-score">0</span></h3>
                </div>
                <div class="info">
                    <h3>Score: <span id="score">0</span></h3>
                </div>
                <div class="info">
                    <h3>Time: <span id="time">00:00</span></h3>
                </div>
            </div>

            <!-- Board -->
            <div class="board">
            </div>

            <!-- Navigation Buttons for small screens -->
            <div class="navigation">
                <div class="up-navigation">
                    <button class="btn nav-btn" data-direction="up">Up</button>
                </div>
                <div class="left-right-navigation">
                    <button class="btn nav-btn" data-direction="left">Left</button>
                    <button class="btn nav-btn" data-direction="right">Right</button>
                </div>
                <div class="down-navigation">
                    <button class="btn nav-btn" data-direction="down">Down</button>
                </div>

            </div>
        </section>

        <div class="modal">
            <div class="start-game">
                <h3>Welcome to Snake Game</h3>
                <button class="btn btn-start">Start Game</button>
            </div>
            <div class="game-over">
                <h3>Game Over</h3>
                <button class="btn btn-restart">Restart Game</button>
            </div>
        </div>
    </main>

    <!-- 
        Short description of the game:
        
    -->

    <script src="script.js"></script>
</body>

</html>
