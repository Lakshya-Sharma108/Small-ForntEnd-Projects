<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="MainSection">
        <div class="heading">
            <h2>Expense Tracker</h2>
            <p>A Project by Lakshaya Awasthi</p>
            <button type="reset">Reset Data</button>
        </div>
        <div class="MainContainer">
            <div class="left">
                <h3>Financial Summary</h3>
                <div class="summary">
                    <div class="totalBalance summaryItem">
                        <h4>Total Balance</h4>
                        <h3>₹50</h3>
                    </div>
                    <div class="totalIncome summaryItem">
                        <h4>Total Income</h4>
                        <h3>₹0</h3>
                    </div>
                    <div class="totalExpense summaryItem">
                        <h4>Total Expense</h4>
                        <h3>₹0</h3>
                    </div>
                </div>
                <div class="chartContainer">
                    <div class="piChart">

                    </div>
                    <div class="stats">
                        <!-- <p><span class="balanceStat">Balance: ₹0</span></p> -->
                        <p><span class="incomeStat">Income</span></p>
                        <p><span class="expenseStat">Expense</span></p>
                    </div>
                </div>
            </div>



            <div class="right">
                <h3>Add Transactions</h3>
                <div class="form">
                    <div class="transactionTitle">
                        <label for="title">Transaction Title</label>
                        <input type="text" id="title" placeholder="e.g. Salary, Groceries, etc.">
                    </div>

                    <div class="transactionAmount">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" placeholder="e.g. 5000">
                    </div>

                    <div class="select">
                        <label for="type">Type</label>
                        <select id="type">
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>

                    <div class="category">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="salary">Salary</option>
                            <option value="groceries">Groceries</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="utilities">Utilities</option>
                            <option value="transportation">Transportation</option>
                            <option value="healthcare">Healthcare</option>
                            <option value="education">Education</option>
                            <option value="miscellaneous">Miscellaneous</option>
                        </select>
                    </div>
                    <div class="date">
                        <label for="date">Date</label>
                        <input type="date" id="date">
                    </div>
                    <div class="addButton">
                        <button type="submit">Add Transaction</button>
                    </div>
                </div>
            </div>
        </div>


        <div class="TransactionHistory">
            <h3>Transaction History</h3>

            <!-- <div class="transaction">
                <div class="transactionDetails">
                    <h4>Groceries</h4>
                    <p>₹2000</p>
                    <button>Delete</button>
                </div>
                <div class="transactionDate">
                    <p>2024-06-02</p>
                </div>
            </div> -->

            <!-- More transactions can be added here -->
        </div>
    </section>



    <script src="script.js"></script>
</body>

</html>
