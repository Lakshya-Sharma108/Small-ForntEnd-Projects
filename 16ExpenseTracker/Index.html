<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="MainSection">
        <div class="heading">
            <h2>Expense Tracker</h2>
            <p>A Project by Lakshaya Awasthi</p>
            <button type="reset">Reset Data</button>
        </div>
        <div class="MainContainer">
            <div class="left">
                <h3>Financial Summary</h3>
                <div class="summary">
                    <div class="totalBalance summaryItem">
                        <h4>Total Balance</h4>
                        <h3>₹10000</h3>
                    </div>
                    <div class="totalIncome summaryItem">
                        <h4>Total Income</h4>
                        <h3>₹35000</h3>
                    </div>
                    <div class="totalExpense summaryItem">
                        <h4>Total Expense</h4>
                        <h3>₹4000</h3>
                    </div>
                </div>
                <div class="chartContainer">
                    <canvas class="piChart">
                        <ul class="key">
                            <li>
                                <strong class="percent red">4%</strong>
                                <span class="choice">Jump right in, startupfille here I come.</span>
                            </li>
                        </ul>
                    </canvas>
                    <div class="stats">
                        <p><span class="balanceStat">Balance: ₹31000</span></p>
                        <p><span class="incomeStat">Income: ₹35000</span></p>
                        <p><span class="expenseStat">Expense: ₹4000</span></p>
                    </div>
                </div>
            </div>



            <div class="right">

            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
